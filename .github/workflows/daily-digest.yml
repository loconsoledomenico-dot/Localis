name: Daily digest

# Ogni giorno alle 06:00 UTC = 08:00 in Italia (CEST, ora legale).
# In inverno (CET, UTC+1) corrisponderebbe alle 07:00: regolare il cron se serve.
# Gira qui e non su un PC perche' il portatile di casa e' acceso solo in viaggio.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # digest-data.mjs elenca i commit di ieri: con la profondita' 1 di
          # default il git log sarebbe vuoto.
          fetch-depth: 100

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Scrivi il service account GA4
        env:
          GA4_SERVICE_ACCOUNT: ${{ secrets.GA4_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GA4_SERVICE_ACCOUNT" ]; then
            echo "::error::secret GA4_SERVICE_ACCOUNT mancante: il digest non puo' leggere GA4."
            exit 1
          fi
          printf '%s' "$GA4_SERVICE_ACCOUNT" > "$RUNNER_TEMP/ga4-sa.json"

      - name: Componi e invia il digest
        env:
          GA4_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/ga4-sa.json
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: Localis <luigi@localis.guide>
        run: node scripts/daily-digest.mjs --send

      - name: Cancella il service account
        if: always()
        run: rm -f "$RUNNER_TEMP/ga4-sa.json"
