name: Publish scheduled blog posts

# Ogni giorno alle 10:00 UTC = 12:00 in Italia (CEST, ora legale).
# In inverno (CET, UTC+1) corrisponderebbe alle 11:00: regolare il cron se serve.
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-scheduled-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flip due drafts to published
        run: node scripts/publish-scheduled.mjs

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain src/content/blog)" ]; then
            git config user.name "localis-bot"
            git config user.email "actions@users.noreply.github.com"
            git add src/content/blog/*.mdx
            git commit -m "chore(blog): pubblica articoli programmati ($(date -u +%F))"
            git push
          else
            echo "Nessun articolo da pubblicare oggi."
          fi
