[build]
  publish = "dist"
  command = "pnpm build"

[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--max-old-space-size=4096"
  NPM_FLAGS = "--no-frozen-lockfile"
  # The Netlify secrets scanner trips on the *name* of these env vars
  # appearing in source/docs (process.env.X references, .env.example,
  # planning docs). The real values live only in Netlify env config and
  # are never committed.
  SECRETS_SCAN_OMIT_KEYS = "STRIPE_WEBHOOK_SECRET,STRIPE_SECRET_KEY,STRIPE_PUBLISHABLE_KEY,Stripe_id_singola,Stripe_id_bundle,Stripe_id_crociera,RESEND_API_KEY,RESEND_FROM_EMAIL,JWT_SECRET,R2_ACCESS_KEY,R2_SECRET_KEY,R2_ACCOUNT_ID"

# Cache headers for build assets (Astro outputs to /_astro/)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache headers for trailers
[[headers]]
  for = "/audio/trailers/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Accept-Ranges = "bytes"

# Full guide audio must only be served through signed R2 URLs issued by
# /api/audio-url. Keep this redirect forced so accidental files in public/
# cannot bypass checkout/access controls on Netlify.
[[redirects]]
  from = "/audio/guides/*"
  to = "/404"
  status = 404
  force = true

# Cache headers for static images
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# HTML: short cache, allow stale while revalidate
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP ENFORCING (promossa da Report-Only il 2026-06-09 dopo console pulita
    # in produzione). Origins enumerati dal codice:
    #   scripts: inline (26 blocks + define:vars + JSON-LD) → 'unsafe-inline' required;
    #            plausible, GTM, GA4, PostHog. styles: Tailwind inline + Google/Bunny fonts.
    #   media: R2 signed audio + same-origin trailers. frame: OpenStreetMap embed.
    #   checkout is a server-side 303 redirect to Stripe (no Stripe.js) → form-action allows it.
    # Rollback: rinomina in Content-Security-Policy-Report-Only (o git revert).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io https://*.googletagmanager.com https://*.google-analytics.com https://*.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.bunny.net; font-src 'self' data: https://fonts.gstatic.com https://fonts.bunny.net; img-src 'self' data: https://api.qrserver.com https://*.google-analytics.com https://*.googletagmanager.com https://www.openstreetmap.org https://*.tile.openstreetmap.org; media-src 'self' blob: https://*.r2.cloudflarestorage.com; connect-src 'self' https://plausible.io https://*.google-analytics.com https://*.googletagmanager.com https://*.posthog.com https://*.r2.cloudflarestorage.com; frame-src https://www.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; frame-ancestors 'none'"

# HTTPS + apex enforcement (Phase 0 production hardening)
[[redirects]]
  from = "http://localis.guide/*"
  to = "https://localis.guide/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.localis.guide/*"
  to = "https://localis.guide/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.localis.guide/*"
  to = "https://localis.guide/:splat"
  status = 301
  force = true

# Force the Netlify default subdomain to redirect to the custom domain
# so all traffic, cookies, Stripe success_url and email magic links
# resolve under localis.guide.
[[redirects]]
  from = "https://localis-guide.netlify.app/*"
  to = "https://localis.guide/:splat"
  status = 301
  force = true

# QR stampati col vecchio schema (home?p=slug): portali alla landing partner.
# La home è statica e il middleware non ci gira: il redirect vive qui.
[[redirects]]
  from = "/"
  to = "/p/:p"
  status = 302
  force = true
  [redirects.query]
    p = ":p"

[[redirects]]
  from = "/en/"
  to = "/p/:p"
  status = 302
  force = true
  [redirects.query]
    p = ":p"

[[redirects]]
  from = "/de/"
  to = "/p/:p"
  status = 302
  force = true
  [redirects.query]
    p = ":p"

# Partner QR landing: noindex via headers (destinate ad attribuzione/QR, non al ranking)
[[headers]]
  for = "/p/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/en/p/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/de/p/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/poster/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/poster/"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/poster-vetrina/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/poster-vetrina/"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/recover"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/access-invalid"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/thanks"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/404"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
