[build]
  publish = "dist"
  command = "pnpm build"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-frozen-lockfile"
  # The Netlify secrets scanner trips on the *name* of these env vars
  # appearing in source/docs (process.env.X references, .env.example,
  # planning docs). The real values live only in Netlify env config and
  # are never committed.
  SECRETS_SCAN_OMIT_KEYS = "STRIPE_WEBHOOK_SECRET,STRIPE_SECRET_KEY,STRIPE_PUBLISHABLE_KEY,Stripe_id_singola,Stripe_id_bundle,RESEND_API_KEY,RESEND_FROM_EMAIL,JWT_SECRET,R2_ACCESS_KEY,R2_SECRET_KEY,R2_ACCOUNT_ID"

# Cache headers for build assets (Astro outputs to /_astro/)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache headers for trailers
[[headers]]
  for = "/audio/trailers/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Accept-Ranges = "bytes"

# Cache headers for static images
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# HTML: short cache, allow stale while revalidate
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# HTTPS + apex enforcement (Phase 0 production hardening)
[[redirects]]
  from = "http://localis.guide/*"
  to = "https://localis.guide/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.localis.guide/*"
  to = "https://localis.guide/:splat"
  status = 301
  force = true

# Force the Netlify default subdomain to redirect to the custom domain
# so all traffic, cookies, Stripe success_url and email magic links
# resolve under localis.guide.
[[redirects]]
  from = "https://localis-guide.netlify.app/*"
  to = "https://localis.guide/:splat"
  status = 301
  force = true
